<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语言表达训练 - 上海小螺号能力开发中心</title>
<link rel="icon" href="小螺号logo.svg" type="image/svg+xml">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --canvas: #f7f5ef;
  --canvas-2: #eef6f3;
  --surface: #ffffff;
  --surface-soft: #f9fbf8;
  --ink: #263034;
  --text: #536066;
  --muted: #7e8b90;
  --line: #dde6e0;
  --primary: #2f7d72;
  --primary-dark: #1f5f57;
  --gold: #b8860b;
  --amber: #d4a843;
  --coral: #d97062;
  --blue: #4f79a8;
  --sage: #789966;
  --danger: #b45a50;
  --shadow: 0 18px 50px rgba(38, 48, 52, 0.1);
  --shadow-soft: 0 10px 28px rgba(38, 48, 52, 0.08);
  --radius: 8px;
  --nav-height: 72px;
}

body {
  min-height: 100vh;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans SC", sans-serif;
  line-height: 1.7;
  background:
    linear-gradient(90deg, rgba(47, 125, 114, 0.05) 1px, transparent 1px),
    linear-gradient(180deg, rgba(47, 125, 114, 0.05) 1px, transparent 1px),
    linear-gradient(145deg, var(--canvas) 0%, var(--canvas-2) 100%);
  background-size: 30px 30px, 30px 30px, auto;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(110deg, rgba(255,255,255,0.8), rgba(255,255,255,0.42) 48%, rgba(255,255,255,0.7));
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
}

.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  height: var(--nav-height);
  background: rgba(247, 245, 239, 0.92);
  border-bottom: 1px solid rgba(184, 134, 11, 0.12);
  backdrop-filter: blur(18px);
}

.nav-inner {
  max-width: 1260px;
  height: 100%;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.nav-logo {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--ink);
  font-size: 17px;
  font-weight: 800;
}

.nav-logo img {
  width: 38px;
  height: 38px;
  border-radius: 8px;
  box-shadow: var(--shadow-soft);
  flex: 0 0 auto;
}

.nav-logo span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-back {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 18px;
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(135deg, var(--amber), var(--gold));
  box-shadow: 0 8px 22px rgba(184, 134, 11, 0.22);
  font-size: 14px;
  font-weight: 750;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.nav-back:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 26px rgba(184, 134, 11, 0.28);
}

.nav-back svg,
.icon {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
}

.app {
  max-width: 1260px;
  margin: 0 auto;
  padding: 104px 24px 42px;
}

.app-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 24px;
  margin-bottom: 18px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  color: var(--primary-dark);
  font-size: 13px;
  font-weight: 850;
}

.eyebrow::before {
  content: "";
  width: 22px;
  height: 3px;
  border-radius: 999px;
  background: var(--coral);
}

h1 {
  color: var(--ink);
  font-size: 34px;
  line-height: 1.2;
  font-weight: 900;
  margin-bottom: 8px;
}

.app-head p {
  max-width: 700px;
  color: var(--muted);
  font-size: 16px;
}

.daily-strip {
  display: grid;
  grid-template-columns: repeat(3, 112px);
  gap: 8px;
}

.daily-stat {
  min-height: 74px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.82);
  box-shadow: var(--shadow-soft);
}

.daily-stat strong {
  display: block;
  color: var(--ink);
  font-size: 22px;
  line-height: 1.1;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

.daily-stat span {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.3;
}

.workspace {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

.panel,
.trainer {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.92);
  box-shadow: var(--shadow);
}

.panel {
  padding: 16px;
}

.panel-title,
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--ink);
  font-size: 16px;
  font-weight: 900;
  line-height: 1.35;
}

.panel-title small,
.section-title small {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.level-list {
  display: grid;
  gap: 8px;
  margin: 14px 0 16px;
}

.level-card {
  width: 100%;
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  min-height: 70px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text);
  background: #fff;
  text-align: left;
  cursor: pointer;
  transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
}

.level-card:hover {
  transform: translateY(-1px);
  border-color: rgba(47, 125, 114, 0.35);
  box-shadow: var(--shadow-soft);
}

.level-card.active {
  border-color: var(--primary);
  background: #eef8f5;
}

.level-index {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: #fff;
  background: var(--primary);
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

.level-card:nth-child(2) .level-index {
  background: var(--blue);
}

.level-card:nth-child(3) .level-index {
  background: var(--coral);
}

.level-card strong {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--ink);
  font-size: 14px;
  white-space: nowrap;
}

.level-card span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.task-list {
  display: grid;
  gap: 8px;
  max-height: calc(100vh - 390px);
  min-height: 300px;
  overflow: auto;
  padding-right: 2px;
}

.task-row {
  width: 100%;
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  min-height: 58px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}

.task-row.active {
  border-color: var(--primary);
  background: #f1f8f5;
}

.task-row.done {
  border-color: rgba(120, 153, 102, 0.4);
}

.task-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #dbe5df;
}

.task-row.active .task-dot {
  background: var(--primary);
}

.task-row.done .task-dot {
  background: var(--sage);
}

.task-row strong {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--ink);
  font-size: 13px;
  white-space: nowrap;
}

.task-row span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.task-row small {
  color: var(--primary-dark);
  font-size: 12px;
  font-weight: 800;
}

.trainer {
  overflow: hidden;
  min-height: 0;
}

.trainer-top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px;
  padding: 20px;
  border-bottom: 1px solid var(--line);
  background:
    linear-gradient(120deg, rgba(47, 125, 114, 0.08), rgba(79, 121, 168, 0.08)),
    var(--surface);
}

.trainer-kicker {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.pill {
  min-height: 26px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border-radius: 999px;
  color: var(--primary-dark);
  background: rgba(47, 125, 114, 0.1);
  font-size: 12px;
  font-weight: 850;
}

.pill.blue {
  color: #315a82;
  background: rgba(79, 121, 168, 0.12);
}

.trainer-title {
  color: var(--ink);
  font-size: 28px;
  line-height: 1.25;
  font-weight: 900;
}

.trainer-subtitle {
  margin-top: 6px;
  color: var(--text);
  font-size: 15px;
}

.status-box {
  width: 132px;
  min-height: 88px;
  display: grid;
  align-content: center;
  justify-items: center;
  padding: 12px;
  border: 1px solid rgba(47, 125, 114, 0.2);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.76);
}

.status-box strong {
  color: var(--ink);
  font-size: 28px;
  line-height: 1;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

.status-box span {
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 750;
}

.trainer-body {
  display: grid;
  grid-template-columns: minmax(380px, 1.05fr) minmax(340px, 0.95fr);
}

.scene-zone {
  min-height: 0;
  padding: 22px;
  border-right: 1px solid var(--line);
  background:
    radial-gradient(circle at center, rgba(255,255,255,0.98), rgba(247,251,248,0.72) 60%, rgba(238,246,243,0.82));
}

.scene-card {
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-rows: auto auto auto;
  gap: 14px;
}

.scene-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}

.scene-label span:last-child {
  color: var(--primary-dark);
}

.scene-visual {
  width: 100%;
  aspect-ratio: 3 / 2;
  min-height: 0;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  overflow: hidden;
}

.scene-visual svg {
  width: min(100%, 330px);
  height: auto;
  display: block;
}

.scene-image {
  width: 100%;
  height: 100%;
  min-height: 0;
  display: block;
  object-fit: contain;
  object-position: center;
  background: #fff;
}

.spoken-preview {
  min-height: 74px;
  padding: 14px;
  border-left: 4px solid var(--primary);
  border-radius: var(--radius);
  background: #f1f8f5;
}

.spoken-preview strong {
  display: block;
  margin-bottom: 4px;
  color: var(--ink);
  font-size: 13px;
}

.spoken-preview p {
  color: var(--text);
  font-size: 15px;
}

.build-zone {
  padding: 22px;
}

.cue-box {
  min-height: 110px;
  padding: 18px;
  border-left: 4px solid var(--blue);
  border-radius: var(--radius);
  background: #f5f8fc;
}

.cue-box strong {
  display: block;
  margin-bottom: 6px;
  color: var(--ink);
  font-size: 14px;
}

.cue-box p {
  color: var(--text);
  font-size: 15px;
}

.slot-stack {
  display: grid;
  gap: 10px;
  margin: 18px 0;
}

.slot-row {
  display: grid;
  grid-template-columns: 84px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-soft);
}

.slot-label {
  min-height: 34px;
  display: inline-flex;
  align-items: center;
  color: var(--ink);
  font-size: 13px;
  font-weight: 850;
}

.option-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.option-btn,
.rating-btn {
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text);
  background: #fff;
  cursor: pointer;
  font-size: 13px;
  font-weight: 750;
  transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
}

.option-btn:hover,
.rating-btn:hover {
  transform: translateY(-1px);
  border-color: rgba(47, 125, 114, 0.35);
}

.option-btn.selected,
.rating-btn.selected {
  color: #fff;
  border-color: var(--primary);
  background: var(--primary);
}

.slot-row.correct {
  border-color: rgba(120, 153, 102, 0.42);
  background: #f3f8f1;
}

.slot-row.wrong {
  border-color: rgba(217, 112, 98, 0.45);
  background: #fff6f4;
}

.sentence-strip {
  min-height: 74px;
  padding: 14px;
  border-radius: var(--radius);
  background: #fff9ec;
  border: 1px solid rgba(184, 134, 11, 0.18);
}

.sentence-strip strong {
  display: block;
  margin-bottom: 4px;
  color: #775207;
  font-size: 13px;
}

.sentence-strip p {
  color: var(--ink);
  font-size: 17px;
  font-weight: 850;
}

.result-box {
  display: none;
  margin-top: 12px;
  padding: 14px;
  border-radius: var(--radius);
  font-size: 14px;
}

.result-box.show {
  display: block;
}

.result-box.pass {
  color: #45602e;
  background: #f2f8ed;
  border: 1px solid rgba(120, 153, 102, 0.28);
}

.result-box.fail {
  color: #8c4038;
  background: #fff2ef;
  border: 1px solid rgba(217, 112, 98, 0.28);
}

.rating-panel {
  display: none;
  margin-top: 12px;
  padding: 14px;
  border-radius: var(--radius);
  background: #f7fbf8;
  border: 1px solid var(--line);
}

.rating-panel.show {
  display: block;
}

.rating-panel strong {
  display: block;
  margin-bottom: 10px;
  color: var(--ink);
  font-size: 13px;
}

.rating-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.control-row {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 10px;
  padding: 18px 20px 20px;
  border-top: 1px solid var(--line);
  background: var(--surface);
}

.btn {
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 15px;
  font-weight: 850;
  transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
}

.btn:hover:not(:disabled) {
  transform: translateY(-1px);
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.46;
}

.btn-primary {
  color: #fff;
  background: var(--primary);
  box-shadow: 0 12px 26px rgba(47, 125, 114, 0.22);
}

.btn-primary:hover:not(:disabled) {
  background: var(--primary-dark);
}

.btn-secondary {
  color: var(--primary-dark);
  background: #edf7f4;
  border-color: rgba(47, 125, 114, 0.22);
}

.btn-plain {
  color: var(--text);
  background: #fff;
  border-color: var(--line);
}

.btn svg {
  width: 18px;
  height: 18px;
}

.coach-panel {
  display: grid;
  gap: 16px;
}

.side-section {
  display: grid;
  gap: 10px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

.side-section:last-child {
  padding-bottom: 0;
  border-bottom: 0;
}

.structure-list,
.watch-list,
.records-list {
  display: grid;
  gap: 8px;
}

.structure-item,
.watch-list li {
  list-style: none;
  position: relative;
  padding: 10px 12px 10px 34px;
  border-radius: var(--radius);
  color: var(--text);
  background: var(--surface-soft);
  font-size: 14px;
}

.structure-item::before {
  content: attr(data-index);
  position: absolute;
  left: 10px;
  top: 11px;
  width: 17px;
  height: 17px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  background: var(--primary);
  font-size: 10px;
  font-weight: 900;
}

.watch-list li::before {
  content: "";
  position: absolute;
  left: 14px;
  top: 18px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
}

.coach-note {
  padding: 12px;
  border: 1px solid rgba(79, 121, 168, 0.22);
  border-radius: var(--radius);
  color: #315a82;
  background: #f3f7fb;
  font-size: 13px;
}

.records-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.clear-btn {
  min-height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  background: #fff;
  cursor: pointer;
  font-size: 12px;
  font-weight: 750;
}

.clear-btn:hover {
  color: var(--danger);
  border-color: rgba(217, 112, 98, 0.5);
}

.record-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--line);
}

.record-item:last-child {
  border-bottom: 0;
}

.record-item strong {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--ink);
  font-size: 13px;
  white-space: nowrap;
}

.record-item span {
  display: block;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.record-badge {
  align-self: center;
  min-height: 26px;
  display: inline-flex;
  align-items: center;
  padding: 0 9px;
  border-radius: 999px;
  color: var(--primary-dark);
  background: rgba(47, 125, 114, 0.1);
  font-size: 12px;
  font-weight: 850;
}

.empty {
  min-height: 76px;
  display: grid;
  place-items: center;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 40;
  min-height: 44px;
  max-width: min(420px, calc(100vw - 32px));
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 18px;
  border-radius: 999px;
  color: #fff;
  background: var(--ink);
  box-shadow: var(--shadow);
  font-size: 14px;
  font-weight: 750;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 12px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.footer {
  padding: 26px 0 10px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}

@media (max-width: 1120px) {
  .app-head {
    grid-template-columns: 1fr;
    align-items: start;
  }

  .daily-strip {
    grid-template-columns: repeat(3, minmax(104px, 1fr));
  }

  .workspace {
    grid-template-columns: 280px minmax(0, 1fr);
  }
}

@media (max-width: 820px) {
  .app {
    padding: 92px 16px 32px;
  }

  .nav-inner {
    padding: 0 16px;
  }

  .nav-logo span {
    max-width: 150px;
  }

  .nav-back {
    min-height: 38px;
    padding: 0 13px;
    font-size: 13px;
  }

  h1 {
    font-size: 28px;
  }

  .workspace,
  .trainer-body {
    grid-template-columns: 1fr;
  }

  .task-list {
    max-height: none;
    min-height: 0;
  }

  .scene-zone {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  apology: { label: "道歉", color: "#f4e1dc", object: "talk", image: "images/language-scenes/apology-classroom.png" },
  choice: { label: "选择", color: "#dfeee8", object: "bookshelf", image: "images/language-scenes/quiet-reading-corner.png" },
  family: { label: "周末", color: "#f2e8c9", object: "family", image: "images/language-scenes/family-park-walk.png" }
};

const RATINGS = [
  { id: "independent", label: "独立表达" },
  { id: "prompted", label: "提示后表达" },
  { id: "practice", label: "继续练习" }
];

const STORAGE_RECORDS = "languageExpressionRecordsV2";
const STORAGE_DONE = "languageExpressionDoneV2";

const state = {
  levelId: "basic",
  taskIndex: 0,
  selections: {},
  checked: false,
  correct: false,
  rating: null,
  records: [],
  done: new Set(),
  toastTimer: null
};

const $ = (id) => document.getElementById(id);

const els = {
  statDone: $("statDone"),
  statIndependent: $("statIndependent"),
  statAccuracy: $("statAccuracy"),
  levelCount: $("levelCount"),
  taskCount: $("taskCount"),
  levelList: $("levelList"),
  taskList: $("taskList"),
  currentLevelLabel: $("currentLevelLabel"),
  currentGoal: $("currentGoal"),
  taskTitle: $("taskTitle"),
  taskPrompt: $("taskPrompt"),
  statusNumber: $("statusNumber"),
  statusText: $("statusText"),
  sceneType: $("sceneType"),
  sceneFocus: $("sceneFocus"),
  sceneVisual: $("sceneVisual"),
  spokenPreview: $("spokenPreview"),
  taskCue: $("taskCue"),
  slotStack: $("slotStack"),
  sentenceFrame: $("sentenceFrame"),
  resultBox: $("resultBox"),
  ratingPanel: $("ratingPanel"),
  ratingRow: $("ratingRow"),
  checkBtn: $("checkBtn"),
  completeBtn: $("completeBtn"),
  nextBtn: $("nextBtn"),
  structureList: $("structureList"),
  watchList: $("watchList"),
  recordsList: $("recordsList"),
  clearBtn: $("clearBtn"),
  toast: $("toast")
};

function todayKey() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function currentLevel() {
  return LEVELS.find((level) => level.id === state.levelId) || LEVELS[0];
}

function currentTasks() {
  return TASKS[state.levelId] || TASKS.basic;
}

function currentTask() {
  const tasks = currentTasks();
  return tasks[state.taskIndex] || tasks[0];
}

function loadData() {
  const today = todayKey();
  try {
    const records = JSON.parse(localStorage.getItem(STORAGE_RECORDS)) || [];
    state.records = records.filter((record) => record.date === today);
  } catch {
    state.records = [];
  }

  try {
    const doneStore = JSON.parse(localStorage.getItem(STORAGE_DONE)) || {};
    state.done = new Set(doneStore[today] || []);
  } catch {
    state.done = new Set();
  }
}

function saveData() {
  const today = todayKey();
  let allRecords = [];
  try {
    allRecords = JSON.parse(localStorage.getItem(STORAGE_RECORDS)) || [];
  } catch {
    allRecords = [];
  }

  const oldRecords = allRecords.filter((record) => record.date !== today);
  localStorage.setItem(STORAGE_RECORDS, JSON.stringify([...oldRecords, ...state.records].slice(-100)));

  let doneStore = {};
  try {
    doneStore = JSON.parse(localStorage.getItem(STORAGE_DONE)) || {};
  } catch {
    doneStore = {};
  }
  doneStore[today] = [...state.done];
  localStorage.setItem(STORAGE_DONE, JSON.stringify(doneStore));
}

function resetAnswer() {
  state.selections = {};
  state.checked = false;
  state.correct = false;
  state.rating = null;
}

function renderLevels() {
  els.levelList.innerHTML = LEVELS.map((level, index) => `
    <button class="level-card ${level.id === state.levelId ? "active" : ""}" type="button" data-level="${level.id}">
      <span class="level-index">${index + 1}</span>
      <span>
        <strong>${level.name}</strong>
        <span>${level.focus}</span>
      </span>
    </button>
  `).join("");
}

function renderTasks() {
  const tasks = currentTasks();
  els.levelCount.textContent = `${tasks.length} 题`;
  els.taskCount.textContent = `${state.taskIndex + 1}/${tasks.length}`;
  els.taskList.innerHTML = tasks.map((task, index) => `
    <button class="task-row ${index === state.taskIndex ? "active" : ""} ${state.done.has(task.id) ? "done" : ""}" type="button" data-index="${index}">
      <span class="task-dot" aria-hidden="true"></span>
      <span>
        <strong>${task.title}</strong>
        <span>${task.goal}</span>
      </span>
      <small>${state.done.has(task.id) ? "已练" : index + 1}</small>
    </button>
  `).join("");
}

function renderTrainer() {
  const level = currentLevel();
  const task = currentTask();
  const scene = SCENES[task.scene];

  els.currentLevelLabel.textContent = level.name;
  els.currentGoal.textContent = task.goal;
  els.taskTitle.textContent = task.title;
  els.taskPrompt.textContent = task.prompt;
  els.sceneType.textContent = task.type;
  els.sceneFocus.textContent = level.goal;
  els.sceneVisual.innerHTML = renderSceneSvg(scene);
  els.taskCue.textContent = task.cue;
  els.sentenceFrame.textContent = task.frame;

  const filled = task.slots.filter((slot) => Boolean(state.selections[slot.key])).length;
  els.statusNumber.textContent = `${filled}/${task.slots.length}`;
  els.statusText.textContent = state.checked ? (state.correct ? "准备表达" : "调整词语") : "组织句子";
  els.spokenPreview.textContent = buildSentencePreview(task);

  renderSlots(task);
  renderResult(task);
  renderRating();
  renderButtons();
}

function renderSlots(task) {
  els.slotStack.innerHTML = task.slots.map((slot) => {
    let rowClass = "slot-row";
    if (state.checked) {
      rowClass += state.selections[slot.key] === slot.answer ? " correct" : " wrong";
    }

    return `
      <div class="${rowClass}" data-slot="${slot.key}">
        <div class="slot-label">${slot.label}</div>
        <div class="option-list">
          ${slot.options.map((option) => `
            <button class="option-btn ${state.selections[slot.key] === option ? "selected" : ""}" type="button" data-slot="${slot.key}" data-value="${option}">
              ${option}
            </button>
          `).join("")}
        </div>
      </div>
    `;
  }).join("");
}

function renderResult(task) {
  els.resultBox.className = "result-box";
  els.resultBox.textContent = "";

  if (!state.checked) return;

  if (state.correct) {
    els.resultBox.className = "result-box show pass";
    els.resultBox.textContent = `组织正确。请开口说：${task.model}`;
  } else {
    const missing = task.slots
      .filter((slot) => state.selections[slot.key] !== slot.answer)
      .map((slot) => slot.label)
      .join("、");
    els.resultBox.className = "result-box show fail";
    els.resultBox.textContent = `再调整：${missing}。按正确语序重新组织后重试。`;
  }
}

function renderRating() {
  els.ratingPanel.classList.toggle("show", state.checked && state.correct);
  els.ratingRow.innerHTML = RATINGS.map((rating) => `
    <button class="rating-btn ${state.rating === rating.id ? "selected" : ""}" type="button" data-rating="${rating.id}">
      ${rating.label}
    </button>
  `).join("");
}

function renderCoach(task) {
  if (!els.structureList || !els.watchList) return;

  els.structureList.innerHTML = task.structure.map((item, index) => (
    `<div class="structure-item" data-index="${index + 1}">${item}</div>`
  )).join("");

  els.watchList.innerHTML = task.watch.map((item) => `<li>${item}</li>`).join("");
}

function renderButtons() {
  const task = currentTask();
  const filled = task.slots.every((slot) => Boolean(state.selections[slot.key]));
  els.checkBtn.disabled = !filled;
  els.completeBtn.disabled = !(state.checked && state.correct && state.rating);
}

function renderRecords() {
  const totalTasks = Object.values(TASKS).reduce((sum, tasks) => sum + tasks.length, 0);
  const independent = state.records.filter((record) => record.rating === "independent").length;
  els.statDone.textContent = `${state.done.size}/${totalTasks}`;
  els.statIndependent.textContent = String(independent);
  els.statAccuracy.textContent = String(state.records.length);

  if (!els.recordsList) return;

  if (state.records.length === 0) {
    els.recordsList.innerHTML = '<div class="empty">完成表达后会在这里显示</div>';
    return;
  }

  els.recordsList.innerHTML = state.records.slice().reverse().slice(0, 7).map((record) => `
    <div class="record-item">
      <div>
        <strong>${record.title}</strong>
        <span>${record.level} · ${ratingLabel(record.rating)} · ${record.timeText}</span>
      </div>
      <div class="record-badge">${record.correct ? "通过" : "再练"}</div>
    </div>
  `).join("");
}

function renderAll() {
  renderLevels();
  renderTasks();
  renderTrainer();
  renderRecords();
}

function buildSentencePreview(task) {
  const values = Object.values(state.selections).filter(Boolean);
  if (values.length === 0) return "先选择词语，组成一句完整的话。";
  return buildSentenceFromPattern(task, state.selections, "____");
}

function buildSentenceFromPattern(task, values, fallback) {
  return task.pattern.replace(/\{([^}]+)\}/g, (_, key) => values[key] || fallback);
}

function selectLevel(levelId) {
  if (!TASKS[levelId] || levelId === state.levelId) return;
  state.levelId = levelId;
  state.taskIndex = 0;
  resetAnswer();
  renderAll();
}

function selectTask(index) {
  const tasks = currentTasks();
  if (index < 0 || index >= tasks.length || index === state.taskIndex) return;
  state.taskIndex = index;
  resetAnswer();
  renderAll();
}

function selectOption(slotKey, value) {
  state.selections[slotKey] = value;
  state.checked = false;
  state.correct = false;
  state.rating = null;
  renderTrainer();
}

function checkAnswer() {
  const task = currentTask();
  const filled = task.slots.every((slot) => Boolean(state.selections[slot.key]));
  if (!filled) {
    showToast("请先把每个词语位置选完整");
    return;
  }

  state.checked = true;
  state.correct = task.slots.every((slot) => state.selections[slot.key] === slot.answer);
  state.rating = null;
  renderTrainer();

  if (state.correct) {
    showToast("组织正确，现在开口说完整句");
  } else {
    showToast("有词语不合适，按提示调整一下");
  }
}

function chooseRating(rating) {
  if (!RATINGS.some((item) => item.id === rating)) return;
  state.rating = rating;
  renderTrainer();
}

function completeTask() {
  const task = currentTask();
  const level = currentLevel();
  if (!(state.checked && state.correct && state.rating)) {
    showToast("先检查正确，并选择表达表现");
    return;
  }

  state.done.add(task.id);
  state.records.push({
    id: task.id,
    title: task.title,
    level: level.name,
    rating: state.rating,
    correct: state.correct,
    date: todayKey(),
    sentence: task.model,
    timeText: new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })
  });

  if (state.records.length > 40) {
    state.records = state.records.slice(-40);
  }

  saveData();
  showToast("已记录本次表达");
  nextTask();
}

function nextTask() {
  const tasks = currentTasks();
  state.taskIndex = (state.taskIndex + 1) % tasks.length;
  resetAnswer();
  renderAll();
}

function clearRecords() {
  if (!window.confirm("确定清空今日语言表达记录？")) return;
  state.records = [];
  state.done = new Set();
  saveData();
  resetAnswer();
  renderAll();
  showToast("今日记录已清空");
}

function ratingLabel(rating) {
  const item = RATINGS.find((entry) => entry.id === rating);
  return item ? item.label : "已表达";
}

function showToast(message) {
  window.clearTimeout(state.toastTimer);
  els.toast.textContent = message;
  els.toast.classList.add("show");
  state.toastTimer = window.setTimeout(() => {
    els.toast.classList.remove("show");
  }, 1800);
}

    family: `
      <circle cx="92" cy="126" r="24" fill="#f2c9ad"/>

  return `
    <svg viewBox="0 0 320 260" role="img" aria-label="${scene.label}">

}

els.levelList.addEventListener("click", (event) => {
  const button = event.target.closest(".level-card");
  if (!button) return;
  selectLevel(button.dataset.level);
});

els.taskList.addEventListener("click", (event) => {
  const button = event.target.closest(".task-row");
  if (!button) return;
  selectTask(Number(button.dataset.index));
});

els.slotStack.addEventListener("click", (event) => {
  const button = event.target.closest(".option-btn");
  if (!button) return;
  selectOption(button.dataset.slot, button.dataset.value);
});

els.ratingRow.addEventListener("click", (event) => {
  const button = event.target.closest(".rating-btn");
  if (!button) return;
  chooseRating(button.dataset.rating);
});

els.checkBtn.addEventListener("click", checkAnswer);
els.completeBtn.addEventListener("click", completeTask);
els.nextBtn.addEventListener("click", nextTask);
if (els.clearBtn) els.clearBtn.addEventListener("click", clearRecords);

loadData();
renderAll();
</script>
</body>
</html>
